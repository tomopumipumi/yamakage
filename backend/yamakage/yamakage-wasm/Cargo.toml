[package]
name = "yamakage-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.127"
solar-positioning = "0.5.3"
chrono = { version = "0.4.45", features = ["wasmbind"] }
png = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1