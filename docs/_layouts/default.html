<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title | escape }} |
    {% endif %}
    {{ site.title | default: "Documentation" | escape }}
  </title>

  <style>
    body {
      margin: 0;
      color: #24292f;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
      overflow-wrap: anywhere;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    pre:not(.mermaid) {
      padding: 1rem;
      overflow-x: auto;
      background: #f6f8fa;
      border-radius: 6px;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
    }

    .mermaid {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      text-align: center;
      background: transparent;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.5rem 0.75rem;
      border: 1px solid #d0d7de;
    }
  </style>
</head>

<body>
  <main>
    {{ content }}
  </main>

  {% include mermaid.html %}
</body>
</html>
