<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>YAMAKAGE</title>
    <style>
      body { margin: 0; background-color: #0f172a; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: white; font-family: sans-serif;
      }
      .spinner {
        width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite; 
        margin-bottom: 24px;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div style="letter-spacing: 0.1em; font-weight: bold; font-size: 1.5rem;">YAMAKAGE</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
